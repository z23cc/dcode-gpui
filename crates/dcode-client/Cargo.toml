[package]
name = "dcode-client"
description = "Client for the DCode host's WebSocket protocol (/rpc and /stream)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-io = "2.6.0"
async-net = "2.0.0"
async-tungstenite = "0.35.0"
futures-lite = "2.6.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0.104"
smol = "2.0.2"
